    <!-- API Placeholder -->

    <!-- Styles -->
    <style>
      :root {
        --bg-primary: #4CCF17;
        --bg-secondary: #2E220E;
        --text-primary: #f5f7ff;
        --text-secondary: #b8bfd4;
        --accent: #6aa8ff;
        --accent-glow: rgba(106, 168, 255, 0.45);

        --font-main: "IBM Plex Serif", serif;
        --font-display: "Playfair Display", serif;
        --font-tech: "Tomorrow", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        scroll-behavior: smooth;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        background:
          radial-gradient(circle at top left, rgba(106,168,255,0.08), transparent 40%),
          radial-gradient(circle at bottom right, rgba(140,90,255,0.12), transparent 35%),
          var(--bg-primary);

        color: var(--text-primary);
        font-family: var(--font-main);
        min-height: 100vh;
        overflow-x: hidden;
      }

      ::selection {
        background: var(--accent);
        color: #fff;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        user-select: none;
        -webkit-user-drag: none;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: #0a1022;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #6aa8ff, #8a5cff);
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #8dbdff, #a37cff);
      }

      /* Typography Classes */
      .ibm-plex {
        font-family: "IBM Plex Serif", serif;
        text-decoration: none;
      }

      .cormorant-garamond {
        font-family: "Cormorant Garamond", serif;
        text-decoration: none;
      }

      .playfair {
        font-family: "Playfair Display", serif;
      }

      .playfair-sc {
        font-family: "Playfair Display SC", serif;
      }

      .spectral {
        font-family: "Spectral", serif;
      }

      .tomorrow {
        font-family: "Tomorrow", sans-serif;
      }

      /* Utilities */
      .glass {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .glow {
        box-shadow:
          0 0 15px rgba(106,168,255,0.25),
          0 0 40px rgba(106,168,255,0.12);
      }

      .gradient-text {
        background: linear-gradient(90deg, #ffffff, #9ec6ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .animated-grid {
        background-image:
          linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

        background-size: 40px 40px;
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulseGlow {
        0% {
          box-shadow: 0 0 10px rgba(106,168,255,0.15);
        }
        50% {
          box-shadow: 0 0 35px rgba(106,168,255,0.35);
        }
        100% {
          box-shadow: 0 0 10px rgba(106,168,255,0.15);
        }
      }

      .fade-in {
        animation: fadeIn 0.45s ease forwards;
      }

      .pulse-glow {
        animation: pulseGlow 3s infinite ease-in-out;
      }
    </style>
  </head>

  <!-- Body -->
  <body>

    <!-- Text -->
    <div>
      <p class="ibm-plex">
        Welcome To Z-AI's Official Website.<br>
        We are currently still developing it so expect it to take some time.
      </p>

      <!-- Prompt area -->
      <div>
        <textarea class="comorant-garamond">
          This is the prompt box!
        </textarea>
        <button class="Send-Prompt">
          Send
        </button>
      </div>
    </div>

  </body>

</html>
