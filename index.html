    <script>

      const BASE32_ALPHABET = "0123456789ABCDEFGHIQRSTUVWXTU";

      function generateBase32Key(prefix = "sk-or-v1-") {
        const length = 64;
        let key = "";
        const randomValues = new Uint32Array(length);
        window.crypto.getRandomValues(randomValues);

        for (let i = 0; i < length; i++) {
          const index = randomValues[i] % BASE32_ALPHABET.length;
          key += BASE32_ALPHABET[index];
        }
        return `${prefix}${key}`;
      }

      function toggleModal(show) {
        const overlay = document.getElementById("apiKeyModal");
        if (show) {
          overlay.classList.add("active");
        }
        else {
          overlay.classList.remove("active");
          document.getElementById("modalForm").style.display = "block";
          document.getElementById("modalResult").style.display = "none";
          document.getElementById("userEmail").value = "";
        }
      }

      function processModalSubmission() {
        const emailInput = document.getElementById("userEmail").value;
        if (!emailInput) {
          alert("Please fill out the field.");
          return;
        }

        const generatedKey = generateBase32Key();

        document.getElementById("apiKeyDisplay").innerText = generatedKey;
        document.getElementById("modalForm").style.display = "none";
        document.getElementById("modalResult").style.display = "block";
      }

      function copyKeyToClipboard() {
        const keyText = document.getElementById("apiKeyDisplay").innerText;
        navigator.clipboard.writeText(keyText).then(() => {
          const copyBtn = document.getElementById("copyBtn");
          copyBtn.innerText = "Copied!";
          copyBtn.style.background = "#28a745";

          setTimeout(() => {
            toggleModal(false);
            copyBtn.innerText = "Copy API Key";
            copyBtn.style.background = "#0070f3";
          }, 1200);
        });
      }
